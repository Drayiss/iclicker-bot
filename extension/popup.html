<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>iClicker Bot</title><style>
body{font:14px system-ui;background:#101923;color:#eaf2f8;width:350px;padding:18px;margin:0}h1{font-size:20px;margin:0 0 6px}p{color:#aebecd;line-height:1.5}label{display:block;margin:14px 0 5px}input,select,button{box-sizing:border-box;width:100%;padding:10px;border-radius:7px;border:1px solid #405467;background:#172735;color:#fff}button{cursor:pointer;background:#26846d;margin-top:12px;font-weight:600}button.secondary{background:#253747}#status{white-space:pre-wrap;font-size:12px}
</style></head><body><h1>iClicker Bot</h1><p>Connect one Edge tab to the app on your PC.</p><label for="token">Pairing code from the app</label><input id="token" type="password" autocomplete="off"><label for="tab">Tab to monitor</label><select id="tab"></select><button id="arm">Connect this tab</button><button class="secondary" id="disarm">Disconnect</button><button class="secondary" id="scan">Show last detection check</button><pre id="scan-details" hidden style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px"></pre><p id="status" role="status"></p><script type="module" src="popup.js"></script></body></html>
